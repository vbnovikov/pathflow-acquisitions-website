name: Acquisitions SEO checks

on:
  pull_request:
  push:
    branches:
      - seo/prerender-indexability-20261011

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run router:typecheck
      - run: node --test tests/seo-build.test.mjs
