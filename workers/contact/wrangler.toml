name = "pathflow-contact"
main = "src/index.ts"
compatibility_date = "2026-09-24"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://getpathflow.com,https://www.getpathflow.com,http://localhost:5173,http://127.0.0.1:5173"
EMAIL_FROM = "website@getpathflow.com"
EMAIL_FROM_NAME = "Pathflow Website"
EMAIL_TO = "info@getpathflow.com"
CONTACT_SUBJECT_PREFIX = "New Pathflow inquiry"
REQUIRE_TURNSTILE = "false"

[[send_email]]
name = "EMAIL"
destination_address = "info@getpathflow.com"
allowed_sender_addresses = ["website@getpathflow.com"]
remote = true
